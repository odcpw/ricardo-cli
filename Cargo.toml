[package]
name = "ricardo-cli"
version = "0.1.0"
edition = "2024"
description = "Live Ricardo auctions and account data for agents, using your browser session"
license = "MIT"

[[bin]]
name = "ricardo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
scraper = "0.24"
uuid = { version = "1", features = ["v4"] }
fsqlite = { version = "=0.3.16", default-features = false, features = ["native"] }
asupersync = { version = "=0.4.10", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
